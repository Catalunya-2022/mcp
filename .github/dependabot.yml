# SHA-pinned actions never move on their own; dependabot proposes the bumps.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node type definitions must track the MINIMUM supported engine
      # (package.json engines >= 22), not the newest Node release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
